<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Perkenalan Diri - AR/VR</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky color="#dfeaf4"></a-sky>

      <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>

      <a-box
        position="0 1.5 -3"
        rotation="0 45 0"
        color="#4CC3D9"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 5000; easing: linear">
      </a-box>

      <a-text
        value="Halo, Nama Saya m vicky azhari\nNIM: 2409020070"
        position="-1.5 2.6 -3"
        color="#111"
        scale="0.8 0.8 0.8">
      </a-text>

      <a-plane position="0 0 -3" rotation="-90 0 0" width="12" height="12" color="#7BC8A4"></a-plane>

      <a-sphere position="-2 0.7 -2.5" radius="0.5" color="#FF6F61"></a-sphere>
      <a-cylinder position="2 0.8 -2.5" radius="0.4" height="1.5" color="#6C5CE7"></a-cylinder>

      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
      <a-light type="directional" position="2 4 -2" intensity="0.9"></a-light>
    </a-scene>
  </body>
</html>
